<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GO Time</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚆</text></svg>" />
  <script>
    // Apply the saved theme before the page paints, so there's no flash of the wrong colours.
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
  <!-- Vercel Web Analytics (plain-HTML setup; served by Vercel at /_vercel/insights) -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f3fbf5;
      --card: #ffffff;
      --ink: #1f3b2c;
      --muted: #6b8a78;
      --green: #2e9e5b;
      --green-soft: #dcf3e4;
      --pink: #ffd6e0;
      --border: #d7eadd;
      --thumb: #b5dcc3;
      --warn: #b45f06; --warn-soft: #fdebd3; --bad: #c0392b; --bad-soft: #fbe0dc;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #12201a; --card: #1a2d24; --ink: #e6f5ec; --muted: #9dbba9;
        --green: #5fd08c; --green-soft: #21402f; --pink: #4a2a35; --border: #2a4536;
        --thumb: #3b6a50; color-scheme: dark;
        --warn: #f3b25f; --warn-soft: #43321c; --bad: #ff8a7a; --bad-soft: #4a2622;
      }
    }
    :root[data-theme="dark"] {
      --bg: #12201a; --card: #1a2d24; --ink: #e6f5ec; --muted: #9dbba9;
      --green: #5fd08c; --green-soft: #21402f; --pink: #4a2a35; --border: #2a4536;
      --thumb: #3b6a50; color-scheme: dark;
        --warn: #f3b25f; --warn-soft: #43321c; --bad: #ff8a7a; --bad-soft: #4a2622;
    }
    body, .card, li, select, .date-btn { transition: background-color .25s, border-color .25s, color .25s; }
    .toggles { position: fixed; top: 14px; right: 14px; z-index: 20; display: flex; gap: 8px; }
    .clock-toggle {
      height: 44px; padding: 0 12px; border: 2px solid var(--border); border-radius: 999px;
      background: var(--card); color: var(--ink); box-shadow: 0 3px 0 var(--border);
      font: inherit; font-weight: 900; font-size: .85rem; cursor: pointer;
    }
    .clock-toggle:hover { transform: scale(1.05); }
    .clock-toggle:focus-visible { outline: 3px solid var(--green-soft); outline-offset: 2px; }
    @media (max-width: 640px) {
      .toggles { position: static; justify-content: flex-end; margin: -16px 0 10px; }
    }

    /* live status */
    .live { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
    .live:empty { display: none; }
    .pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 2px 9px; font-size: .72rem; font-weight: 800; }
    .pill.ok { background: var(--green-soft); color: var(--green); }
    .pill.late { background: var(--warn-soft); color: var(--warn); }
    .pill.bad { background: var(--bad-soft); color: var(--bad); }
    .pill.info { background: var(--bg); color: var(--muted); border: 1.5px solid var(--border); }
    li.cancelled .times { text-decoration: line-through; text-decoration-thickness: 2px; opacity: .6; }
    .times-col { display: flex; flex-direction: column; min-width: 0; }
    .alerts { display: grid; gap: 8px; margin: 0 0 12px; }
    .alert {
      background: var(--warn-soft); color: var(--ink); border: 2px solid var(--warn); border-radius: 16px;
      padding: 10px 14px; font-size: .85rem;
    }
    .alert summary { font-weight: 800; cursor: pointer; list-style: none; }
    .alert summary::-webkit-details-marker { display: none; }
    .alert summary::before { content: "⚠️ "; }
    .alert p { margin: 6px 0 0; color: var(--ink); white-space: pre-line; }
    .live-bar { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 8px; margin: -6px 0 12px; }
    .live-bar[hidden] { display: none; }
    .live-note { color: var(--muted); font-size: .75rem; font-weight: 700; text-align: center; }
    .live-note:empty { display: none; }
    .refresh-btn {
      display: inline-flex; align-items: center; gap: 5px; font: inherit; font-size: .78rem; font-weight: 800;
      color: var(--green); background: var(--green-soft); border: none; border-radius: 999px;
      padding: 5px 12px; cursor: pointer;
    }
    .refresh-btn:hover { filter: brightness(1.05); }
    .refresh-btn:focus-visible { outline: 3px solid var(--green-soft); outline-offset: 2px; }
    .refresh-icon { display: inline-block; font-size: 1rem; line-height: 1; }
    .refresh-btn.spin .refresh-icon { animation: spin .6s ease-in-out; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .theme-toggle {
      width: 44px; height: 44px;
      border: 2px solid var(--border); border-radius: 50%; background: var(--card);
      box-shadow: 0 3px 0 var(--border); font-size: 1.2rem; cursor: pointer;
      display: grid; place-items: center; transition: transform .3s;
    }
    .theme-toggle:hover { transform: rotate(-20deg) scale(1.08); }
    .theme-toggle:focus-visible { outline: 3px solid var(--green-soft); outline-offset: 2px; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
      font-family: "Nunito", system-ui, sans-serif; padding: 32px 16px 64px;
    }
    main { max-width: 560px; margin: 0 auto; }
    h1 { font-size: 2.4rem; font-weight: 900; margin: 0; text-align: center; }
    h1 .train { display: inline-block; animation: chug 2.4s ease-in-out infinite; }
    @keyframes chug { 0%,100% { transform: translateX(-4px) } 50% { transform: translateX(4px) } }
    .sub { text-align: center; color: var(--muted); margin: 4px 0 24px; }
    .card {
      background: var(--card); border: 2px solid var(--border); border-radius: 24px;
      padding: 20px; box-shadow: 0 6px 0 var(--border);
    }
    .route { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: end; }
    label { display: block; font-size: .8rem; font-weight: 700; color: var(--muted); margin: 0 0 4px 6px; }
    select, input {
      width: 100%; font: inherit; font-weight: 700; color: var(--ink); background: var(--bg);
      border: 2px solid var(--border); border-radius: 14px; padding: 10px 12px;
    }
    select:focus, input:focus { outline: 3px solid var(--green-soft); border-color: var(--green); }
    .swap {
      border: none; background: var(--green-soft); color: var(--green); font-size: 1.2rem;
      width: 44px; height: 44px; border-radius: 50%; cursor: pointer; transition: transform .3s;
    }
    .swap:hover { transform: rotate(180deg); }
    .row { display: flex; gap: 12px; margin-top: 14px; align-items: end; flex-wrap: wrap; }
    .row > div { flex: 1; min-width: 150px; }
    .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
    .status { text-align: center; color: var(--muted); margin: 28px 0 12px; font-weight: 700; }
    ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
    li {
      background: var(--card); border: 2px solid var(--border); border-radius: 18px;
      padding: 12px 16px; display: flex; align-items: center; gap: 12px;
    }
    li.past { opacity: .45; }
    li.next { border-color: var(--green); box-shadow: 0 4px 0 var(--green-soft); }
    .times { font-size: 1.3rem; font-weight: 900; font-variant-numeric: tabular-nums; white-space: nowrap; }
    @media (max-width: 440px) {
      .times { font-size: 1.05rem; }
      .times .arrow { margin: 0 3px; }
      li { padding: 12px; gap: 10px; }
    }
    .times .arrow { color: var(--muted); font-weight: 500; margin: 0 6px; }
    .meta { margin-left: auto; text-align: right; font-size: .8rem; color: var(--muted); font-weight: 700; }
    .badge { display: inline-block; background: var(--pink); color: var(--ink); border-radius: 999px; padding: 2px 8px; font-size: .7rem; margin-bottom: 2px; }
    .empty { font-size: 3rem; text-align: center; }

    /* dropdowns */
    select { appearance: none; padding-right: 34px; cursor: pointer; }
    select option { background: var(--card); color: var(--ink); }
    .pick { position: relative; }
    .pick::after {
      content: ""; position: absolute; right: 14px; bottom: 19px; width: 7px; height: 7px;
      border: solid var(--green); border-width: 0 2.5px 2.5px 0; transform: rotate(45deg);
      border-radius: 1px; pointer-events: none;
    }

    /* calendar */
    .datepick { position: relative; }
    .date-btn {
      width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px;
      font: inherit; font-weight: 700; color: var(--ink); background: var(--bg); cursor: pointer;
      border: 2px solid var(--border); border-radius: 14px; padding: 10px 12px; text-align: left;
    }
    .date-btn:focus-visible, .cal button:focus-visible { outline: 3px solid var(--green-soft); outline-offset: 1px; }
    .cal {
      position: absolute; z-index: 10; top: calc(100% + 8px); left: 0; width: min(300px, calc(100vw - 32px));
      background: var(--card); border: 2px solid var(--border); border-radius: 20px;
      box-shadow: 0 6px 0 var(--border), 0 12px 32px rgb(0 0 0 / .12); padding: 14px;
      animation: pop .15s ease-out;
    }
    @keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(.98); } }
    .cal[hidden] { display: none; }
    .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .cal-title { font-weight: 900; }
    .cal button { font: inherit; border: none; cursor: pointer; color: var(--ink); background: none; border-radius: 12px; }
    .cal .cal-nav { width: 34px; height: 34px; background: var(--green-soft); color: var(--green); font-weight: 900; font-size: 1.1rem; }
    .cal .cal-nav:disabled { opacity: .35; cursor: default; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; text-align: center; }
    .cal-dow { font-size: .7rem; font-weight: 700; color: var(--muted); padding: 4px 0; }
    .cal .cal-day { aspect-ratio: 1; font-weight: 700; font-variant-numeric: tabular-nums; }
    .cal .cal-day:hover:not(:disabled) { background: var(--green-soft); }
    .cal .cal-day.today { box-shadow: inset 0 0 0 2px var(--green); }
    .cal .cal-day.sel { background: var(--green); color: var(--card); }
    .cal .cal-day:disabled { color: var(--muted); opacity: .35; cursor: default; }
    .cal-foot { display: flex; justify-content: center; margin-top: 8px; }
    .cal .cal-today { background: var(--pink); padding: 6px 14px; font-weight: 700; font-size: .85rem; border-radius: 999px; }

    /* scrollbars */
    ::-webkit-scrollbar { width: 12px; height: 12px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--thumb); border-radius: 999px; border: 3px solid var(--bg); }
    ::-webkit-scrollbar-thumb:hover { background: var(--green); }
    ::-webkit-scrollbar-corner { background: var(--bg); }
    @supports not selector(::-webkit-scrollbar) {
      html { scrollbar-color: var(--thumb) var(--bg); }
    }
    footer { text-align: center; color: var(--muted); font-size: .75rem; margin-top: 32px; }
    .fresh {
      display: inline-flex; align-items: center; gap: 6px; margin-bottom: 8px; padding: 6px 12px;
      background: var(--green-soft); color: var(--ink); border-radius: 999px; font-weight: 700; font-size: .78rem;
    }
    .fresh[hidden] { display: none; }
    .fresh .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35; } }
  </style>
</head>
<body>
  <div class="toggles">
    <button type="button" class="clock-toggle" id="clockToggle"></button>
    <button type="button" class="theme-toggle" id="themeToggle"></button>
  </div>
  <main>
    <h1><span class="train">🚆</span> GO Time</h1>
    <p class="sub">every direct train, all day, no fuss</p>

    <div class="card">
      <div class="route">
        <div class="pick"><label for="from">From</label><select id="from"></select></div>
        <button class="swap" id="swap" title="Swap stations" aria-label="Swap stations">⇄</button>
        <div class="pick"><label for="to">To</label><select id="to"></select></div>
      </div>
      <div class="row">
        <div class="datepick">
          <label for="dateBtn">Day</label>
          <input type="hidden" id="date" />
          <button type="button" class="date-btn" id="dateBtn" aria-haspopup="dialog" aria-expanded="false">
            <span id="dateLabel"></span><span aria-hidden="true">📅</span>
          </button>
          <div class="cal" id="cal" role="dialog" aria-label="Choose a day" hidden>
            <div class="cal-head">
              <button type="button" class="cal-nav" id="calPrev" aria-label="Previous month">‹</button>
              <span class="cal-title" id="calTitle"></span>
              <button type="button" class="cal-nav" id="calNext" aria-label="Next month">›</button>
            </div>
            <div class="cal-grid" id="calGrid"></div>
            <div class="cal-foot"><button type="button" class="cal-today" id="calToday">Today</button></div>
          </div>
        </div>
      </div>
    </div>

    <p class="status" id="status">Fetching the latest GO timetable… 🚂</p>
    <div class="live-bar" id="liveBar" hidden>
      <span class="live-note" id="liveNote" aria-live="polite"></span>
      <button type="button" class="refresh-btn" id="refreshBtn" title="Refresh live train info" aria-label="Refresh live train info">
        <span class="refresh-icon" aria-hidden="true">↻</span> Refresh
      </button>
    </div>
    <div class="alerts" id="alerts"></div>
    <ul id="list"></ul>
    <footer>
      <div class="fresh" id="fresh" hidden><span class="pulse"></span><span id="freshText"></span></div>
      <div>Timetable from GO Transit’s public GTFS feed (Metrolinx Open Data)</div>
    </footer>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const from = $("from"), to = $("to"), date = $("date");
    const status = $("status"), list = $("list");
    let results = [];

    const store = {
      get(k) { try { return localStorage.getItem(k); } catch { return null; } },
      set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    };

    const today = () => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    };

    let meta = null;
    const dayCache = new Map();

    async function getJson(url) {
      const res = await fetch(url);
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
      return body;
    }

    // "GO updated the timetable Sep 28 · pulled 5 min ago"
    function showFreshness() {
      const ago = (iso) => {
        const mins = Math.round((Date.now() - new Date(iso)) / 60000);
        const rtf = new Intl.RelativeTimeFormat(undefined, { numeric: "auto" });
        if (mins < 1) return "just now";
        if (mins < 60) return rtf.format(-mins, "minute");
        if (mins < 48 * 60) return rtf.format(-Math.round(mins / 60), "hour");
        return rtf.format(-Math.round(mins / 1440), "day");
      };
      const full = (iso) => new Date(iso).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
      const parts = [];
      if (meta.published) parts.push(`GO updated the timetable ${new Date(meta.published).toLocaleDateString(undefined, { month: "short", day: "numeric" })}`);
      if (meta.generated) parts.push(`pulled ${ago(meta.generated)}`);
      if (!parts.length) return;
      $("freshText").textContent = parts.join(" · ");
      $("fresh").title = [
        meta.published && `GO last published the timetable: ${full(meta.published)}`,
        meta.generated && `This site last pulled it: ${full(meta.generated)}`,
      ].filter(Boolean).join("\n");
      $("fresh").hidden = false;
    }

    async function init() {
      try {
        meta = await getJson("/api/index");
        showFreshness();
        const opts = meta.stops.map((s, i) => `<option value="${i}">${s.name}</option>`).join("");
        from.innerHTML = to.innerHTML = opts;
        const idx = (code) => String(Math.max(0, meta.stops.findIndex((s) => s.code === code)));
        from.value = idx(store.get("from") || "UN");
        to.value = idx(store.get("to") || "KI");
        const iso = (d) => `${d.slice(0, 4)}-${d.slice(4, 6)}-${d.slice(6)}`;
        date.min = iso(meta.dates[0]);
        date.max = iso(meta.dates.at(-1));
        load();
      } catch (e) {
        status.textContent = "😿 Couldn't load the timetable: " + e.message;
      }
    }

    // Every direct train on the chosen day that stops at `from`, then later at `to`.
    function findTrains(day, a, b) {
      const out = [];
      for (const t of day.trips) {
        let dep = null;
        for (let i = 2; i < t.length; i += 3) {
          if (t[i] === a && t[i + 2] >= 0) dep = t[i + 2];
          else if (t[i] === b && dep !== null && t[i + 1] >= 0) {
            const arr = t[i + 1], mins = arr - dep, line = day.lines[t[0]];
            out.push({
              departMin: dep, arriveMin: arr, nextDay: dep >= 1440,
              duration: mins >= 60 ? `${Math.floor(mins / 60)}h ${mins % 60}m` : `${mins}m`,
              line: line.name, lineCode: line.code, colour: line.colour, number: String(t[1]),
            });
            break;
          }
        }
      }
      return out.sort((x, y) => x.departMin - y.departMin);
    }

    async function load() {
      const a = +from.value, b = +to.value;
      store.set("from", meta.stops[a].code); store.set("to", meta.stops[b].code);
      list.innerHTML = "";
      stopLive();
      if (a === b) { status.textContent = "Pick two different stations 🙂"; return; }
      const d = date.value.replaceAll("-", "");
      if (!meta.dates.includes(d)) {
        status.textContent = `No timetable for that day yet 📅 (available ${date.min} to ${date.max})`;
        return;
      }
      status.textContent = "Checking the timetable… 🚂";
      const req = `${a}|${b}|${d}`;
      load.last = req;
      try {
        if (!dayCache.has(d)) dayCache.set(d, getJson(`/api/day?date=${d}`));
        const day = await dayCache.get(d);
        if (load.last !== req) return; // a newer request superseded this one
        results = findTrains(day, a, b);
        render(true);
        startLive();
      } catch (e) {
        dayCache.delete(d);
        status.textContent = "😿 " + e.message;
      }
    }

    // ---------- time format (24h or 12h AM/PM) ----------
    let clock = store.get("clock") === "12" ? "12" : "24";
    function fmt(mins) {
      const m = ((mins % 1440) + 1440) % 1440, h = Math.floor(m / 60), mm = String(m % 60).padStart(2, "0");
      if (clock === "24") return `${String(h).padStart(2, "0")}:${mm}`;
      return `${h % 12 || 12}:${mm} ${h < 12 ? "AM" : "PM"}`;
    }
    const clockBtn = $("clockToggle");
    function drawClockBtn() {
      clockBtn.textContent = clock === "24" ? "24h" : "AM/PM";
      clockBtn.title = `Switch to ${clock === "24" ? "12-hour (AM/PM)" : "24-hour"} time`;
      clockBtn.setAttribute("aria-label", clockBtn.title);
    }
    clockBtn.onclick = () => {
      clock = clock === "24" ? "12" : "24";
      store.set("clock", clock);
      drawClockBtn();
      if (results.length) render(false);
    };
    drawClockBtn();

    // ---------- live delays (today only, just the trains on screen) ----------
    let live = null, liveTimer = null, liveReq = 0, liveEnabled = true, lastLiveFetch = 0;
    const REFRESH_GAP = 15_000; // at most one live request per 15 s, however often Refresh is pressed
    const stopName = (code) => meta.stops.find((s) => s.code === code)?.name || code;
    const nowMin = () => new Date().getHours() * 60 + new Date().getMinutes();

    function stopLive() {
      clearInterval(liveTimer); liveTimer = null; live = null; liveReq++;
      $("alerts").innerHTML = ""; $("liveNote").textContent = "";
      $("liveBar").hidden = true;
    }

    function startLive() {
      if (date.value !== today() || !results.length) return;
      $("liveBar").hidden = false;
      fetchLive();
      restartLiveTimer();
    }

    function restartLiveTimer() {
      clearInterval(liveTimer);
      liveTimer = setInterval(() => { if (!document.hidden) fetchLive(); }, 60_000);
    }

    async function fetchLive() {
      if (!liveEnabled) { $("liveBar").hidden = true; return; }
      // Only trains that haven't left the From station yet; past trains keep their last info.
      const now = nowMin();
      const trains = results.filter((r) => expectedDeparture(r) >= now).slice(0, 80);
      if (!trains.length) { render(false); return; }
      const a = meta.stops[+from.value].code, b = meta.stops[+to.value].code;
      const lines = [...new Set(trains.map((r) => r.lineCode).filter(Boolean))];
      const q = new URLSearchParams({ from: a, to: b, trips: trains.map((r) => r.number).join(","), lines: lines.join(",") });
      const req = ++liveReq;
      lastLiveFetch = Date.now();
      try {
        const data = await getJson(`/api/live?${q}`);
        if (req !== liveReq) return; // route or day changed meanwhile
        if (!data.enabled) { liveEnabled = false; clearInterval(liveTimer); $("liveBar").hidden = true; return; } // no API key configured
        // Replace info for the trains we asked about; keep what we last knew about the rest.
        const kept = Object.fromEntries(Object.entries(live?.trips || {}).filter(([n]) => !trains.some((r) => r.number === n)));
        live = { ...data, trips: { ...kept, ...data.trips } };
        render(false);
      } catch {
        if (req === liveReq) $("liveNote").textContent = "Live updates are unavailable right now";
      }
    }

    // Refresh button: always feels responsive, but silently skips the API call if the
    // last live request was under 15 s ago (it still re-marks which trains have left).
    const refreshBtn = $("refreshBtn");
    refreshBtn.onclick = () => {
      refreshBtn.classList.remove("spin"); void refreshBtn.offsetWidth; refreshBtn.classList.add("spin");
      if (Date.now() - lastLiveFetch < REFRESH_GAP) { render(false); return; }
      fetchLive();
      restartLiveTimer();
    };

    function livePills(r) {
      const s = live?.trips?.[r.number];
      if (!s) return "";
      const out = [];
      if (s.cancelled) out.push(`<span class="pill bad">✖ Cancelled</span>`);
      else {
        if (s.skips?.length) out.push(`<span class="pill bad">Skips ${s.skips.map(stopName).join(" & ")}</span>`);
        const delay = s.departDelay ?? s.delay;
        if (delay != null) {
          if (delay >= 2) {
            const at = s.departs != null ? ` · leaves ${fmt(s.departs)}` : "";
            out.push(`<span class="pill late">🟠 ${delay} min late${at}</span>`);
          } else out.push(`<span class="pill ok">🟢 On time</span>`);
        }
        if (s.platform) out.push(`<span class="pill info">Platform ${s.platform}</span>`);
      }
      return out.join("");
    }

    // A train counts as gone once its (possibly delayed) departure has passed.
    function expectedDeparture(r) {
      const s = live?.trips?.[r.number];
      return r.departMin + Math.max(0, s?.departDelay ?? s?.delay ?? 0);
    }

    function renderAlerts() {
      const esc = (t) => t.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
      $("alerts").innerHTML = (live?.alerts || []).map((al) =>
        `<details class="alert"><summary>${esc(al.subject || "Service alert")}</summary>${al.body ? `<p>${esc(al.body)}</p>` : ""}</details>`
      ).join("");
      if (live) {
        const t = new Date(live.updated).toLocaleTimeString([], { hour: "numeric", minute: "2-digit", hour12: clock === "12" });
        $("liveNote").textContent = `🛰️ Live status for this route · updated ${t}${live.partial ? " (some info missing)" : ""}`;
      }
    }

    function render(scroll) {
      if (!results.length) {
        status.textContent = "No direct trains that day 🥲";
        list.innerHTML = "";
        return;
      }
      const isToday = date.value === today();
      const now = new Date().getHours() * 60 + new Date().getMinutes();
      let nextMarked = false;
      status.textContent = `${results.length} direct train${results.length === 1 ? "" : "s"} ✨`;
      renderAlerts();
      list.innerHTML = results.map((r) => {
        const cancelled = !!live?.trips?.[r.number]?.cancelled;
        let cls = cancelled ? "cancelled" : "";
        if (isToday && expectedDeparture(r) < now) cls += " past";
        else if (isToday && !nextMarked && !cancelled) { cls += " next"; nextMarked = true; }
        const badge = cls.includes("next") ? `<span class="badge">next up</span><br>` : "";
        const late = r.nextDay ? ` <small title="after midnight">🌙</small>` : "";
        return `<li class="${cls.trim()}">
          <span class="dot" style="background:#${r.colour || "2e9e5b"}"></span>
          <span class="times-col">
            <span class="times">${fmt(r.departMin)}<span class="arrow">→</span>${fmt(r.arriveMin)}${late}</span>
            <span class="live">${isToday ? livePills(r) : ""}</span>
          </span>
          <span class="meta">${badge}⏱ ${r.duration}<br>${r.line} · #${r.number}</span>
        </li>`;
      }).join("");
      if (scroll) document.querySelector("li.next")?.scrollIntoView({ block: "center", behavior: "smooth" });
    }

    // ---------- calendar ----------
    const cal = $("cal"), dateBtn = $("dateBtn");
    let view = null; // first day of the month on screen
    const parse = (v) => { const [y, m, d] = v.split("-").map(Number); return new Date(y, m - 1, d); };
    const isoOf = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    const hasData = (v) => !meta || meta.dates.includes(v.replaceAll("-", ""));

    function setDate(v) {
      date.value = v;
      $("dateLabel").textContent = parse(v).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", year: "numeric" });
    }

    function drawCal() {
      const y = view.getFullYear(), m = view.getMonth();
      $("calTitle").textContent = view.toLocaleDateString(undefined, { month: "long", year: "numeric" });
      const monthKey = (d) => d.getFullYear() * 12 + d.getMonth();
      $("calPrev").disabled = !!date.min && monthKey(view) <= monthKey(parse(date.min));
      $("calNext").disabled = !!date.max && monthKey(view) >= monthKey(parse(date.max));
      const dows = [...Array(7)].map((_, i) => new Date(2024, 0, 7 + i).toLocaleDateString(undefined, { weekday: "narrow" }));
      let html = dows.map((d) => `<span class="cal-dow">${d}</span>`).join("");
      html += "<span></span>".repeat(new Date(y, m, 1).getDay());
      for (let d = 1; d <= new Date(y, m + 1, 0).getDate(); d++) {
        const v = isoOf(new Date(y, m, d));
        const cls = ["cal-day", v === today() && "today", v === date.value && "sel"].filter(Boolean).join(" ");
        html += `<button type="button" class="${cls}" data-v="${v}" ${hasData(v) ? "" : "disabled"}>${d}</button>`;
      }
      $("calGrid").innerHTML = html;
    }

    function openCal(open) {
      cal.hidden = !open;
      dateBtn.setAttribute("aria-expanded", open);
      if (open) {
        const d = parse(date.value);
        view = new Date(d.getFullYear(), d.getMonth(), 1);
        drawCal();
        cal.querySelector(".sel, .cal-day:not(:disabled)")?.focus();
      }
    }

    function pick(v) { setDate(v); openCal(false); dateBtn.focus(); load(); }

    dateBtn.onclick = () => openCal(cal.hidden);
    $("calPrev").onclick = () => { view.setMonth(view.getMonth() - 1); drawCal(); };
    $("calNext").onclick = () => { view.setMonth(view.getMonth() + 1); drawCal(); };
    $("calToday").onclick = () => pick(today());
    $("calGrid").onclick = (e) => { const b = e.target.closest(".cal-day"); if (b && !b.disabled) pick(b.dataset.v); };
    document.addEventListener("click", (e) => { if (!cal.hidden && !e.target.closest(".datepick")) openCal(false); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !cal.hidden) { openCal(false); dateBtn.focus(); } });
    setDate(today());

    // ---------- light / dark switch ----------
    const themeBtn = $("themeToggle");
    const darkQuery = matchMedia("(prefers-color-scheme: dark)");
    const isDark = () => (document.documentElement.dataset.theme || (darkQuery.matches ? "dark" : "light")) === "dark";
    function drawThemeBtn() {
      themeBtn.textContent = isDark() ? "🌙" : "☀️";
      themeBtn.title = `Switch to ${isDark() ? "light" : "dark"} mode`;
      themeBtn.setAttribute("aria-label", themeBtn.title);
    }
    themeBtn.onclick = () => {
      const next = isDark() ? "light" : "dark";
      document.documentElement.dataset.theme = next;
      store.set("theme", next);
      drawThemeBtn();
    };
    darkQuery.addEventListener("change", drawThemeBtn);
    drawThemeBtn();

    from.onchange = to.onchange = load;
    $("swap").onclick = () => { [from.value, to.value] = [to.value, from.value]; load(); };
    init();
  </script>
</body>
</html>
